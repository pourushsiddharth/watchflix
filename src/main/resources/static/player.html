<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchFlix Sync</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root {
            --bg-color: #141414;
            --surface-color: #1F1F1F;
            --primary-text-color: #EAEAEA;
            --accent-color: #FFA500;
            --shadow-color: rgba(255, 165, 0, 0.15);
            --border-color: #333333;
            --success-color: #4CAF50;
            --error-color: #F44336;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text-color);
            overflow: hidden;
        }
        .main-container { display: flex; height: 100vh; width: 100vw; }
        .player-section { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; min-width: 0; }
        .chat-section { width: 380px; flex-shrink: 0; background-color: var(--bg-color); display: flex; flex-direction: column; border-left: 1px solid var(--border-color); }
        .player-container { width: 100%; max-width: 1200px; aspect-ratio: 16 / 9; position: relative; background-color: #000; border-radius: 12px; box-shadow: 0 0 25px 5px var(--shadow-color); }
        #main-video { width: 100%; height: 100%; display: block; border-radius: 12px; }
        video::-webkit-media-controls { display: none !important; }
        .controls-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 20px; background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; z-index: 5; }
        .player-container:hover .controls-container { opacity: 1; visibility: visible; }
        .button-controls { display: flex; align-items: center; gap: 15px; }
        .control-btn { background: none; border: none; color: var(--primary-text-color); cursor: pointer; font-size: 28px; padding: 5px; transition: transform 0.2s; }
        .control-btn:hover { transform: scale(1.1); color: var(--accent-color); }
        .time-display { font-size: 14px; }
        .spacer { flex: 1; }
        #progress-bar { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; background: rgba(255, 255, 255, 0.25); border-radius: 5px; cursor: pointer; transition: height 0.2s; margin-bottom: 10px; }
        #progress-bar:hover { height: 8px; }
        #progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--accent-color); border-radius: 50%; cursor: pointer; }
        #progress-bar::-moz-range-thumb { width: 16px; height: 16px; background: var(--accent-color); border-radius: 50%; cursor: pointer; border: none; }
        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .connection-status { padding: 10px; text-align: center; font-weight: 500; font-size: 14px; transition: background-color 0.5s, color 0.5s; }
        .status-connected { background-color: var(--success-color); color: white; }
        .status-disconnected { background-color: var(--error-color); color: white; }
        .webcam-streams { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .webcam-streams video { width: 50%; border-radius: 8px; background-color: #000; transform: scaleX(-1); }
        .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .chat-message { display: flex; flex-direction: column; align-items: flex-start; }
        .message-bubble { background-color: #2C2C2C; color: #DCDCDC; padding: 12px 16px; border-radius: 18px; border-top-left-radius: 4px; max-width: 90%; }
        .message-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .message-user { font-weight: 600; font-size: 14px; color: #EAEAEA; }
        .message-content { font-size: 15px; font-style: italic; word-wrap: break-word; }
        .chat-input-area { padding: 16px; border-top: 1px solid var(--border-color); }
        .input-wrapper { display: flex; align-items: center; background-color: #FFFFFF; border-radius: 12px; padding: 6px; }
        #chat-input { flex: 1; border: none; outline: none; background: transparent; padding: 10px; color: #121212; font-size: 15px; }
        #send-btn { background-color: var(--accent-color); border: none; border-radius: 8px; color: white; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="player-section">
        <div class="player-container">
            <video id="main-video" src="https://www.w3schools.com/html/mov_bbb.mp4" muted playsinline></video>
            <div class="controls-container">
                <div class="progress-controls">
                    <input type="range" id="progress-bar" value="0" step="0.1">
                </div>
                <div class="button-controls">
                    <button id="play-pause-btn" class="control-btn"><i class="material-icons">play_arrow</i></button>
                    <div class="time-display" id="current-time">0:00 / 0:00</div>
                    <div class="spacer"></div>
                    <button id="pip-btn" class="control-btn"><i class="material-icons">picture_in_picture_alt</i></button>
                    <button id="fullscreen-btn" class="control-btn"><i class="material-icons">fullscreen</i></button>
                </div>
            </div>
        </div>
    </div>
    <div class="chat-section">
        <div class="chat-container">
            <div id="connection-status" class="connection-status status-disconnected">Connecting...</div>
            <div class="webcam-streams">
                <video id="local-video" autoplay muted></video>
                <video id="remote-video" autoplay></video>
            </div>
            <div class="messages-container" id="messages-container"></div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Type your message...">
                    <button id="send-btn" title="Send"><i class="material-icons">send</i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'Guest' + Math.floor(Math.random() * 1000);
        const roomId = urlParams.get('room');

        if (!roomId) { window.location.href = 'join.html'; return; }

        const playerContainer = document.querySelector('.player-container');
        const video = document.getElementById('main-video');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const pipBtn = document.getElementById('pip-btn');
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('messages-container');
        const connectionStatusEl = document.getElementById('connection-status');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        let stompClient = null;
        let isConnected = false;
        let isServerEvent = false;
        let localStream = null;
        let peerConnection = null;

        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function connect() {
            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, (frame) => {
                isConnected = true;
                connectionStatusEl.textContent = 'Connected';
                connectionStatusEl.className = 'connection-status status-connected';

                displayChatMessage({ user: 'System', content: `Welcome, ${username}!` });

                stompClient.subscribe(`/topic/room/${roomId}/video`, (message) => handleVideoSync(JSON.parse(message.body)));
                stompClient.subscribe(`/topic/room/${roomId}/chat`, (message) => displayChatMessage(JSON.parse(message.body)));
                stompClient.subscribe(`/topic/room/${roomId}/webrtc.signal`, (message) => handleWebRTCSignal(JSON.parse(message.body)));

                stompClient.send(`/app/video.requestSync/${roomId}`, {}, {});
                startWebcamAndSignal();
            }, (error) => {
                isConnected = false;
                connectionStatusEl.textContent = 'Disconnected. Retrying...';
                connectionStatusEl.className = 'connection-status status-disconnected';
                setTimeout(connect, 5000);
            });
        }

        function handleVideoSync(state) {
            isServerEvent = true;
            switch (state.type) {
                case 'PLAY':
                    video.play().catch(e => console.warn("Play interrupted:", e));
                    break;
                case 'PAUSE':
                    video.pause();
                    break;
                case 'SEEK':
                    if (Math.abs(video.currentTime - state.currentTime) > 1.5) {
                        video.currentTime = state.currentTime;
                    }
                    break;
            }
            setTimeout(() => { isServerEvent = false; }, 150);
        }

        function displayChatMessage(message) {
            const chatMessageDiv = document.createElement('div');
            chatMessageDiv.className = 'chat-message';
            chatMessageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="message-header">
                        <span class="message-user">${message.user}</span>
                    </div>
                    <p class="message-content">${message.content}</p>
                </div>
            `;
            messagesContainer.appendChild(chatMessageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function togglePlayPause() {
            if (isServerEvent || !isConnected) return;
            const action = video.paused ? 'PLAY' : 'PAUSE';
            stompClient.send(`/app/video.sync/${roomId}`, {}, JSON.stringify({ type: action }));
        }

        function updatePlayPauseIcon() {
            const icon = video.paused ? 'play_arrow' : 'pause';
            if (playPauseBtn) playPauseBtn.querySelector('i.material-icons').textContent = icon;
        }

        function updateProgress() {
            if (!progressBar || !currentTimeEl || isNaN(video.duration)) return;
            progressBar.value = (video.currentTime / video.duration) * 100;
            const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${String(seconds).padStart(2, '0')}`;
            };
            currentTimeEl.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch((err) => console.error(err));
            } else {
                document.exitFullscreen();
            }
        }

        function sendMessage() {
            const content = chatInput.value;
            if (content.trim() && isConnected) {
                const chatMessage = { user: username, content: content.trim() };
                stompClient.send(`/app/chat.sendMessage/${roomId}`, {}, JSON.stringify(chatMessage));
                chatInput.value = '';
            }
        }

        async function startWebcamAndSignal() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                localVideo.srcObject = localStream;
                sendSignal({ type: 'user-joined' });
            } catch (error) {
                console.error("Error accessing webcam:", error);
                displayChatMessage({ user: 'System', content: 'Webcam access denied.' });
            }
        }

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(servers);

            peerConnection.onicecandidate = event => {
                if (event.candidate) sendSignal({ type: 'candidate', data: event.candidate });
            };

            peerConnection.ontrack = event => {
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }

        async function handleWebRTCSignal(signal) {
            if (signal.sender === username) return;

            switch (signal.type) {
                case 'user-joined':
                    createPeerConnection();
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    sendSignal({ type: 'offer', data: offer });
                    break;
                case 'offer':
                    createPeerConnection();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    sendSignal({ type: 'answer', data: answer });
                    break;
                case 'answer':
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
                    break;
                case 'candidate':
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(signal.data));
                    }
                    break;
            }
        }

        function sendSignal(signal) {
            signal.sender = username;
            if (stompClient && isConnected) {
                stompClient.send(`/app/webrtc.signal/${roomId}`, {}, JSON.stringify(signal));
            }
        }

        video.addEventListener('click', togglePlayPause);
        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('loadedmetadata', updateProgress);
        video.addEventListener('play', updatePlayPauseIcon);
        video.addEventListener('pause', updatePlayPauseIcon);

        if (progressBar) {
            progressBar.addEventListener('change', () => {
                if (!isConnected || isServerEvent) return;
                const newTime = (progressBar.value / 100) * video.duration;
                stompClient.send(`/app/video.sync/${roomId}`, {}, JSON.stringify({ type: 'SEEK', currentTime: newTime }));
            });
        }

        if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);
        if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);
        if (pipBtn) pipBtn.addEventListener('click', () => video.requestPictureInPicture());
        if (sendBtn) sendBtn.addEventListener('click', sendMessage);
        if (chatInput) chatInput.addEventListener('keyup', (e) => e.key === 'Enter' && sendMessage());

        connect();
    });
</script>
</body>
</html>
